# ----------------------------
# Window / UI
# ----------------------------

# Kitty can't do "RESIZE only" decorations like WezTerm.
# On macOS this toggles the whole titlebar presence.
hide_window_decorations yes

# Padding: left/right/top/bottom
window_padding_width 12
window_padding_height 12
# Extra top padding to mimic your big top gap (84px)
# Kitty doesn't have per-side padding, but we can approximate by increasing top margin:
# Use "window_margin_width/height" to add space around the terminal area.
window_margin_width 0
window_margin_height 0
# Workaround: increase overall vertical padding, then compensate via tab bar placement.
# If you really want a huge top-only gap, you'll need a custom macOS titlebar setup;
# Kitty doesn't support top-only padding.
window_padding_height 48

# Slight transparency
background_opacity 0.95

# Hide mouse cursor when typing
mouse_hide_wait 3.0

# ----------------------------
# Fonts
# ----------------------------

font_family      Hack Nerd Font
bold_font        Hack Nerd Font Bold
italic_font      Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size 12.5

# ----------------------------
# Colors (Gruvbox Material-ish)
# ----------------------------
# Kitty doesn't ship "Gruvbox Material (Gogh)" by that exact name.
# The closest "drop-in" approach is to use a theme file.
# Option A: if you use kitty-themes:
#   kitty +kitten themes "Gruvbox Material Dark"
# Option B: include a local theme file:
#   include ~/.config/kitty/themes/gruvbox-material.conf

# Placeholder if you install themes:
# include ~/.config/kitty/current-theme.conf


# ----------------------------
# Tabs (like WezTerm fancy tab bar bottom + hide if one)
# ----------------------------

tab_bar_edge bottom
tab_bar_style powerline
tab_bar_min_tabs 2   # hides tab bar if only one tab
tab_powerline_style slanted

# Make tabs look a bit "fancy"
active_tab_font_style   bold
inactive_tab_font_style normal

# ----------------------------
# Initial Window Size
# ----------------------------

initial_window_width  150c
initial_window_height 50c
